[package]
name = "weft-php"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "PHP extension exposing the weft engine to PHP userland"

[lib]
name = "weft_php"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2.191"
weft = { path = ".." }

[build-dependencies]
cc = "1"

# Keeps this crate out of the engine's package so `cargo` at the repository root is unchanged.
[workspace]
